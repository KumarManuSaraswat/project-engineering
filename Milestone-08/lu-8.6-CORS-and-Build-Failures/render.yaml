# render.yaml — Render Blueprint for LinkShelf

services:
  # ---- Backend API ----
  - type: web
    name: linkshelf-api
    runtime: node
    region: oregon
    plan: free
    # Generate Prisma Client during the build so database calls work in production.
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: linkshelf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # CORS origin: must be a specific origin when using credentials: true.
      - key: CORS_ORIGIN
        value: https://linkshelf-frontend-abc.onrender.com   # TODO: replace with your real frontend URL

  # ---- Frontend (Static Site) ----
  - type: web
    name: linkshelf-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_ENV
        value: production
      # Vite reads this at build time as import.meta.env.VITE_API_URL.
      - key: VITE_API_URL
        value: https://linkshelf-api-xyz.onrender.com       # TODO: replace with your real backend URL

databases:
  - name: linkshelf-db
    plan: free
    region: oregon